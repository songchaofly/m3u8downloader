name: Windows core and UI checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: rustup toolchain install 1.98.1 --profile minimal
      - run: rustup default 1.98.1
      - run: choco install ffmpeg --version=8.0.1 --allow-downgrade -y
      - run: npm ci
      - run: python -m pip install --target .local/test-deps -r scripts/requirements-dev.txt
      - run: cargo fmt --all -- --check
      - run: cargo test -p m3u8-core --tests --locked
      - run: cargo build -p m3u8tool --locked
      - run: python -X utf8 scripts/acceptance.py
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-ui-results
          path: test-results
